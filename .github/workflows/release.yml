name: Release

# Push a tag such as v0.2.0 to build the "bis" CLI and attach it to a GitHub Release.
# Each archive holds a self-contained binary (no .NET necessary) and the install script.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish single-file binary
        shell: bash
        run: >
          dotnet publish BIS.CLI/BIS.CLI.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o publish

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item publish/BIS.CLI.exe pkg/bis.exe
          Copy-Item install.ps1 pkg/
          Compress-Archive -Path pkg/* -DestinationPath bis-${{ matrix.rid }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg
          install -m 755 publish/BIS.CLI pkg/bis
          install -m 755 install.sh pkg/
          tar -czf bis-${{ matrix.rid }}.tar.gz -C pkg .

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: bis-${{ matrix.rid }}
          path: bis-${{ matrix.rid }}.*

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
